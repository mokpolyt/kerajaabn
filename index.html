<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Kingdoms</title>
<style>

:root[data-theme="dark"]{--bg:#14110f}

</style></head><body><div id="w"><canvas id="c"></canvas></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=1400,H=900;cv.width=W;cv.height=H;
const COL=[{n:'Brown',main:'#8b5a2b',dark:'#5a3612',light:'#c48d52',horse:'#4a2f1a'},{n:'Tosca',main:'#17b6a3',dark:'#0a756a',light:'#68e3d3',horse:'#e9e4d2'}];
const GATE=[260,1140],HG=[175,1225],mid=[W/2-28,W/2+28],R=(a,b)=>a+Math.random()*(b-a),SPEC={i:{hp:30,sp:58},c:{hp:45,sp:105},e:{hp:200,sp:38},t:{hp:80,sp:30},m:{hp:38,sp:0},g:{hp:180,sp:0}},TBX=[640,760],twr=[{hp:100,down:false},{hp:100,down:false}],topY=s=>692-(60+170*twr[s].hp/100);
let rt=0,rb=0,phT=0;
const castleHP=[260,260], castleMax=260, mageTimer=[15,16], mageCasting=[0,0]; let troopTimer=[7,11], gameOver=false, winner=-1, dragonFlames=[];
let T,pop,day,units,proj,parts,civs,plots,phase,nextAt,first,raider,war,cap,fallen,cd,uid,paused=false;
function say(s){cap=s}
function init(){twr.forEach(w=>{w.hp=100;w.down=false});castleHP[0]=castleHP[1]=castleMax;mageTimer[0]=15;mageTimer[1]=16;mageCasting[0]=mageCasting[1]=0;troopTimer=[R(7,16),R(7,16)];gameOver=false;winner=-1;dragonFlames=[];rt=0;rb=0;phT=0;T=0;pop=[799,799];day=1;units=[];proj=[];parts=[];civs=[];plots=[[],[]];phase='peace';nextAt=7;first=true;raider=0;war=false;fallen=[0,0];cd=[1,1];uid=0;
 cap='Two kingdoms live in peace… for now.';
 for(let s=0;s<2;s++){for(let i=0;i<8;i++)for(let j=0;j<2;j++)plots[s].push({x:s?W-(70+i*44):70+i*44,y:790+j*50,g:Math.random()<.5?R(.2,1):0});
  for(let k=0;k<3;k++){const p=plots[s][k*5];civs.push({k:'c',t:'f',s,x:p.x,y:p.y+10,st:'work',p:null,wt:0,id:uid++})}
  civs.push({k:'c',t:'w',s,x:s?1100:300,y:600+s*10,dir:s?-1:1,lo:s?760:300,hi:s?1100:640,st:'work',id:uid++})}}
function mk(s,type,i,hold){const q=SPEC[type];return{k:'u',s,type,x:HG[s],y:R(655,760),hp:q.hp,max:q.hp,sp:q.sp,hold,ht:0,cd:0,sg:0,w:i*.2,id:uid++}}
function summonGuards(s){const n=10+Math.floor(Math.random()*6);for(let i=0;i<n;i++){const u=mk(s,'g',i,false);u.x=HG[s]+(s?-1:1)*R(5,95);u.y=R(660,770);u.guard=true;u.homeX=HG[s];u.w=i*.08;units.push(u)}say(COL[s].n+' deploys '+n+' armored castle guards!')}
function launch(s,inf,cav,hold,el=0,tb=0){let i=0;phT=T;for(let a=0;a<tb;a++)units.push(mk(s,'t',i++,hold));for(let a=0;a<el;a++)units.push(mk(s,'e',i++,hold));for(let a=0;a<cav;a++)units.push(mk(s,'c',i++,hold));for(let a=0;a<inf;a++)units.push(mk(s,'i',i++,hold))}
function burst(x,y,c,n,gr=200,sp=120){for(let i=0;i<n;i++)parts.push({x,y,vx:R(-sp,sp),vy:R(-sp,sp*.3),l:R(.4,1),m:1,c,r:R(2,5),gr})}
function endWar(){war=false;phase='peace';nextAt=T+R(9,15);say('Peace returns to the land.')}
function schedule(dt){
 if(gameOver)return;
 for(let s=0;s<2;s++){
  troopTimer[s]-=dt;
  if(troopTimer[s]<=0){
   const d=1-s,n=10+Math.floor(Math.random()*27),cav=Math.random()<.48?2+Math.floor(Math.random()*6):0;
   const tb=Math.random()<.18?1:0,el=Math.random()<.18?1+Math.floor(Math.random()*2):0;
   launch(s,n,cav,false,el,tb);summonGuards(d);phase='raid';war=true;raider=s;
   say(COL[s].n+' sends '+n+' troops toward '+COL[d].n+'!');
   troopTimer[s]=R(7,16);
  }
 }
 if(phase!=='peace'&&T-phT>120)units.forEach(u=>{if(u.type!=='g')u.gone=1});
 if(!units.some(u=>u.type!=='g')&&!dragonFlames.length){war=false;phase='peace'}
}
function update(dt){
 if(gameOver)return; dt*=0.42; T+=dt;
 for(let s=0;s<2;s++){mageTimer[s]-=dt;if(mageTimer[s]<=0){mageTimer[s]+=(s?16:15);mageCasting[s]=3.5;if(Math.random()<.33){const own=Math.random()<.12,target=own?s:1-s;dragonFlames.push({s,target,t:0,duration:6,seed:Math.random()*100});say(COL[s].n+' mage summons a dragon! '+(own?'It attacks its own castle!':'It attacks '+COL[target].n+' castle!'))}else say(COL[s].n+' mage fails to summon a dragon.')}}
 for(const f of dragonFlames){f.t+=dt;if(f.t<=f.duration){castleHP[f.target]=Math.max(0,castleHP[f.target]-7*dt);if(castleHP[f.target]<=0)destroyCastle(f.target)}}
 dragonFlames=dragonFlames.filter(f=>f.t<f.duration);for(let s=0;s<2;s++)mageCasting[s]=Math.max(0,mageCasting[s]-dt);const nd=Math.floor(T/4)+1;if(nd!==day){day=nd;for(let s=0;s<2;s++)pop[s]+=Math.round(pop[s]*.0015+R(0,2))}
 schedule(dt);
 for(const u of units){u.fight=false;u.moving=false;if(u.w>0){u.w-=dt;continue}let e=null,bd=1e9;
  for(const v of units)if(v.s!==u.s&&!(v.w>0)){const d=Math.hypot(v.x-u.x,(v.y-u.y)*1.5);if(d<bd){bd=d;e=v}}
  if(u.type==='m'){continue}
   if(u.type==='g'){if(u.guard){let target=null,dist=1e9;for(const v of units)if(v.s!==u.s&&v.type!=='t'&&!(v.w>0)){const d=Math.hypot(v.x-u.x,(v.y-u.y)*1.4);if(d<dist){dist=d;target=v}}if(target&&dist<250){u.fight=true;if(dist>23){u.x+=Math.sign(target.x-u.x)*65*dt;u.y+=(target.y-u.y)*Math.min(1,dt*2)}else{u.cd-=dt;if(u.cd<=0){target.hp-=26;u.cd=.65;burst((u.x+target.x)/2,(u.y+target.y)/2-20,'#ffe27a',4,0,60)}}}else{u.x+=(u.homeX-u.x)*Math.min(1,dt*2);u.y+=(700-u.y)*Math.min(1,dt*2)}continue}}
   if(u.type==='t'){if(twr[1-u.s].down){u.gone=1;continue}const tx=TBX[u.s];if(Math.abs(tx-u.x)>6){u.x+=Math.sign(tx-u.x)*u.sp*dt;u.moving=true}else{u.cd-=dt;if(u.cd<=0){u.cd=2.8;proj.push({s:u.s,ty:'tb',x0:u.x,y0:u.y-45,x1:u.s?245:1155,y1:topY(1-u.s)+30,t:0,T:1.7,h:230})}}continue}
  if(e&&bd<28){u.fight=true;u.cd-=dt;if(u.cd<=0){e.hp-=({c:15,i:11,e:30})[u.type];u.cd=.5;burst((u.x+e.x)/2,(u.y+e.y)/2-18,'#ffe27a',3,0,60)}u.y+=(e.y-u.y)*dt*2;continue}
  if(u.hold){u.ht+=dt;if((e&&bd<190)||u.ht>8)u.hold=false}
  const tx=u.hold?mid[u.s]: (twr[1-u.s].down? (u.s?180:1220):GATE[1-u.s]);
  if(Math.abs(tx-u.x)>14){u.x+=Math.sign(tx-u.x)*u.sp*dt;u.moving=true}
  else if(!u.hold){u.sg+=dt;u.fight=true;if(!twr[1-u.s].down){hitTower(1-u.s,({i:2.5,c:4,e:14})[u.type]*dt)}else{castleHP[1-u.s]=Math.max(0,castleHP[1-u.s]-({i:1.5,c:3,e:9})[u.type]*dt);if(castleHP[1-u.s]<=0)destroyCastle(1-u.s)}if(u.sg>(u.type=='e'?3.5:1.5)){u.gone=1;const L=u.type=='e'?5:2;pop[1-u.s]-=L;fallen[1-u.s]+=L;pop[u.s]--;fallen[u.s]++;burst(u.x,u.y-20,'#ff8a2a',14)}}}
 for(let s=0;s<2;s++){cd[s]-=dt;if(cd[s]>0)continue;cd[s]=R(.5,.9);if(twr[s].down)continue;let tg=null,bd=1e9;const ox=s?1200:200;
  for(const u of units)if(u.s!==s){const d=Math.abs(u.x-ox);if(!(u.w>0)&&(d<430||(u.type=='t'&&d<600))&&d<bd){bd=d;tg=u}}
  if(tg){const r=Math.random(),ty=r<.4?'rock':r<.7?'fire':'arrow',Tm=.8+bd/900,dir=s?1:-1;
   proj.push({s,ty,x0:s?1155:245,y0:topY(s)-17,x1:tg.x+(tg.moving?dir*tg.sp*Tm:0)+R(-12,12),y1:tg.y-8,t:0,T:Tm})}}
 for(const p of proj){p.t+=dt;if(p.t>=p.T){p.done=1;const[rad,dm]={rock:[42,28],fire:[48,18],arrow:[14,12],sheep:[36,22],tb:[0,0]}[p.ty];
   for(const v of units)if(v.s!==p.s&&Math.hypot(v.x-p.x1,(v.y-p.y1-8)*1.6)<rad)v.hp-=dm;for(const c of civs)if(c.t==='p'&&c.s!==p.s&&Math.hypot(c.x-p.x1,(c.y-p.y1-8)*1.6)<rad)c.dead=1;if(p.ty==='tb'){hitTower(1-p.s,14);burst(p.x1,p.y1,'#9a8f80',16,300,150)}if(p.ty==='sheep')burst(p.x1,p.y1,'#fff',10,200,110);
   if(p.ty=='fire'){for(let i=0;i<18;i++)parts.push({x:p.x1+R(-20,20),y:p.y1+8,vx:R(-20,20),vy:-R(30,120),l:R(.6,1.6),m:1.6,c:['#ff7a18','#ffd23f','#ff4d1c'][i%3],r:R(4,9),gr:-20});burst(p.x1,p.y1,'#555',5,-30,30)}
   else if(p.ty=='rock')burst(p.x1,p.y1+6,'#9a8f80',12,300,130);else if(p.ty=='arrow')burst(p.x1,p.y1+6,'#d8c9a0',3,200,40)}
  else if(p.ty=='fire'&&Math.random()<.8){const q=pos(p);parts.push({x:q.x,y:q.y,vx:R(-15,15),vy:R(-15,15),l:.4,m:.4,c:'#ff9d2e',r:5,gr:0})}}
 proj=proj.filter(p=>!p.done);
 units=units.filter(u=>{if(u.gone)return false;if(u.hp<=0){pop[u.s]--;fallen[u.s]++;burst(u.x,u.y-15,COL[u.s].main,10);return false}return true});
 for(const c of civs)if(c.dead&&!c.rm){c.rm=1;pop[c.s]--;fallen[c.s]++;burst(c.x,c.y-15,'#c0392b',8)}
 if(rt>0){rt-=dt;rb-=dt;const pc=civs.filter(c=>c.t==='p'&&!c.rm);if(!pc.length||rt<=0){rt=0;for(const c of civs)if(c.t==='p')c.rm=1}else if(rb<=0){rb=.4;const c=pc[Math.random()*pc.length|0],a=1-c.s,r=Math.random();
  if(r<.4){for(let i=0;i<4;i++){const x=c.x+R(-45,45);proj.push({s:a,ty:'sheep',x0:x+R(-15,15),y0:-40,x1:x,y1:c.y-8,t:-i*.15,T:1,h:0})}}
  else proj.push({s:a,ty:r<.7?'fire':r<.85?'rock':'arrow',x0:a?1155:245,y0:topY(a)-17,x1:c.x+R(-10,10),y1:c.y-8,t:0,T:1.5,h:260})}}
 civs=civs.filter(c=>!c.rm);
 if(phase==='peace')for(const w of twr)if(w.hp<100){w.hp=Math.min(100,w.hp+0.12*dt);if(w.down&&w.hp>=35)w.down=false}
 for(let s=0;s<2;s++)if(twr[s].hp<60&&Math.random()<.15)parts.push({x:(s?1170:230)+R(-20,20),y:topY(s)-20,vx:R(-6,6),vy:-R(20,40),l:1.4,m:1.4,c:'rgba(70,60,55,.7)',r:R(6,11),gr:-5});
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.gr*dt;q.l-=dt}parts=parts.filter(q=>q.l>0);
 for(const s of[0,1])for(const p of plots[s])if(p.g>0&&p.g<1)p.g=Math.min(1,p.g+dt/20);
 for(const c of civs){
  if(c.t==='p'){c.ct-=dt;if(c.ct<=0){const a=R(0,6.28);c.vx=Math.cos(a)*75;c.vy=Math.sin(a)*40;c.ct=R(.4,1.2)}c.x=Math.max(c.s?880:60,Math.min(c.s?1340:520,c.x+c.vx*dt));c.y=Math.max(640,Math.min(790,c.y+c.vy*dt));c.dir=Math.sign(c.vx)||1;continue}
  if(war){if(c.st==='work')c.st='flee'}else if(c.st!=='work'){if(c.st==='hidden'){c.x=HG[c.s];c.y=692}c.st='work';c.p=null}
  if(c.st==='flee'){const dx=HG[c.s]-c.x,dy=692-c.y,d=Math.hypot(dx,dy);if(d<6)c.st='hidden';else{c.x+=dx/d*120*dt;c.y+=dy/d*120*dt}c.bend=0;c.dir=Math.sign(dx)||1;c.mv=1}
  else if(c.st==='work'&&c.t==='f'){if(!c.p){c.p=plots[c.s][Math.random()*16|0];c.wt=0}
   const dx=c.p.x-c.x,dy=c.p.y+10-c.y,d=Math.hypot(dx,dy);c.dir=Math.sign(dx)||1;
   if(d>3){c.x+=dx/d*38*dt;c.y+=dy/d*38*dt;c.bend=0;c.mv=1}else{c.mv=0;c.bend=1;c.wt+=dt;if(c.wt>1.8){if(c.p.g===0)c.p.g=.01;else if(c.p.g>=1)c.p.g=0;c.p=null;c.bend=0}}}
  else if(c.st==='work'){c.y+=(600+c.s*10-c.y)*Math.min(1,dt*1.5);c.x+=c.dir*30*dt;if(c.x>c.hi)c.dir=-1;if(c.x<c.lo)c.dir=1;c.mv=1}}}
function pos(p){const s=p.t/p.T;return{x:p.x0+(p.x1-p.x0)*s,y:p.y0+(p.y1-p.y0)*s-(p.h===undefined?130:p.h)*4*s*(1-s)}}
// ---------- drawing ----------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
function tower(b,x,y,w,col,light){b.fillStyle=col;b.fillRect(x,y,w,692-y);b.fillRect(x-4,y-14,w+8,14);const m=(w+8)/4;for(let i=0;i<4;i++)b.fillRect(x-4+i*m,y-26,m*.6,13);
 b.strokeStyle='rgba(0,0,0,.16)';b.lineWidth=1.5;for(let yy=y+10;yy<692;yy+=20){b.beginPath();b.moveTo(x,yy);b.lineTo(x+w,yy);b.stroke();for(let xx=x+(((yy-y)/20|0)%2?12:26);xx<x+w;xx+=28){b.beginPath();b.moveTo(xx,yy);b.lineTo(xx,yy+20);b.stroke()}}}
function castle(b,s){const c=COL[s];b.save();if(s){b.translate(W,0);b.scale(-1,1)}
 b.fillStyle='rgba(0,0,0,.2)';b.beginPath();b.ellipse(160,696,160,15,0,0,7);b.fill();
 tower(b,30,490,70,c.dark);tower(b,70,525,190,c.main);
 b.fillStyle='#1e1510';b.beginPath();b.moveTo(135,692);b.lineTo(135,640);b.quadraticCurveTo(160,598,185,640);b.lineTo(185,692);b.fill();
 b.strokeStyle='#4a3a2a';b.lineWidth=2;for(let x=143;x<185;x+=12){b.beginPath();b.moveTo(x,620);b.lineTo(x,692);b.stroke()}
 b.fillStyle='#1e1510';for(const[x,y]of[[100,570],[100,610],[55,530],[55,575]])b.fillRect(x,y,8,18);b.restore()}
function flag(s,x,y){const c=COL[s];g.save();if(s){g.translate(W,0);g.scale(-1,1)}g.strokeStyle='#2b2118';g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x,y-58);g.stroke();
 g.fillStyle=c.light;g.strokeStyle=c.dark;g.lineWidth=2;g.beginPath();g.moveTo(x,y-58);for(let i=0;i<=30;i+=5)g.lineTo(x+i,y-58+Math.sin(T*5+i*.2)*3);for(let i=30;i>=0;i-=5)g.lineTo(x+i,y-38+Math.sin(T*5+i*.2)*3);g.closePath();g.fill();g.stroke();g.restore()}
(function(){const b=bg.getContext('2d');let gr=b.createLinearGradient(0,0,0,580);gr.addColorStop(0,'#7cc4e8');gr.addColorStop(1,'#fbe7bd');b.fillStyle=gr;b.fillRect(0,0,W,H);
 b.fillStyle='rgba(255,244,200,.8)';b.beginPath();b.arc(700,190,42,0,7);b.fill();
 const hill=(base,a1,f1,a2,f2,col)=>{b.fillStyle=col;b.beginPath();b.moveTo(0,H);for(let x=0;x<=W;x+=20)b.lineTo(x,base+a1*Math.sin(x*f1)+a2*Math.sin(x*f2));b.lineTo(W,H);b.fill()};
 hill(500,30,.006,15,.017,'#8db9a2');hill(545,22,.009,10,.023,'#6f9f63');
 gr=b.createLinearGradient(0,570,0,H);gr.addColorStop(0,'#8bb85c');gr.addColorStop(1,'#5b8a3a');b.fillStyle=gr;b.fillRect(0,570,W,H-570);
 b.fillStyle='rgba(205,168,104,.6)';b.beginPath();b.moveTo(0,635);for(let x=0;x<=W;x+=20)b.lineTo(x,632+5*Math.sin(x*.02));for(let x=W;x>=0;x-=20)b.lineTo(x,780+6*Math.sin(x*.03));b.fill();
 b.strokeStyle='rgba(40,80,30,.5)';b.lineWidth=2;for(let i=0;i<220;i++){const x=R(0,W),y=R(575,H);if(y>625&&y<790)continue;b.beginPath();b.moveTo(x,y);b.lineTo(x-2,y-7);b.moveTo(x,y);b.lineTo(x+3,y-6);b.stroke()}
 castle(b,0);castle(b,1)})();
const clouds=[[100,90,1],[420,150,.8],[800,70,1.2],[1100,130,.9],[1300,60,.7]];
function cloud(x,y,k){g.fillStyle='rgba(255,255,255,.75)';for(const[dx,dy,r]of[[0,0,26],[28,-8,32],[58,0,24],[30,8,26]]){g.beginPath();g.arc(x+dx*k,y+dy*k,r*k,0,7);g.fill()}}
function shadow(w){g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.ellipse(0,0,w,3.5,0,0,7);g.fill()}
function drawInf(u){const c=COL[u.s],ph=u.moving?Math.sin(T*10+u.id):0;g.save();g.translate(u.x,u.y);g.scale(u.s?-1:1,1);shadow(11);
 g.strokeStyle='#2b2118';g.lineWidth=3;g.beginPath();g.moveTo(-2,-12);g.lineTo(-2+ph*5,0);g.moveTo(2,-12);g.lineTo(2-ph*5,0);g.stroke();
 g.fillStyle=c.main;g.fillRect(-6,-27,12,16);g.fillStyle='#f0c9a0';g.beginPath();g.arc(0,-32,5,0,7);g.fill();g.fillStyle=c.dark;g.fillRect(-5.5,-38,11,4.5);
 if(u.type==='g'){g.fillStyle='#b7bdc5';g.fillRect(-8,-29,16,17);g.fillStyle='#6e7782';g.fillRect(-7,-37,14,9);g.fillStyle='#e0e4e8';g.fillRect(-6,-39,12,3);g.strokeStyle='#e2e6ea';g.lineWidth=3;g.beginPath();g.moveTo(7,-22);g.lineTo(18,-39);g.stroke();g.restore();return}const sw=u.fight?Math.sin(T*16+u.id)*.9:0;g.strokeStyle='#e4e4e4';g.lineWidth=2.5;g.beginPath();g.moveTo(6,-20);g.lineTo(6+Math.cos(-1.1+sw)*17,-20+Math.sin(-1.1+sw)*17);g.stroke();
 g.fillStyle=c.light;g.strokeStyle=c.dark;g.lineWidth=1.5;g.beginPath();g.arc(-5,-19,6,0,7);g.fill();g.stroke();g.restore()}
function drawCav(u){const c=COL[u.s],ph=u.moving?Math.sin(T*14+u.id):0;g.save();g.translate(u.x,u.y);g.scale(u.s?-1:1,1);shadow(24);
